<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spese ATM">
<title>Spese ATM</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#e2001a">
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#14181f;--mu:#6b7280;--ac:#e2001a;--ac2:#fff;--bd:#e5e7eb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--card:#1a1f27;--tx:#f1f3f6;--mu:#9aa3b0;--bd:#2b323d}}
:root[data-theme="dark"]{--bg:#0e1116;--card:#1a1f27;--tx:#f1f3f6;--mu:#9aa3b0;--bd:#2b323d}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;max-width:520px;margin:0 auto;padding:16px}
.nav{display:flex;align-items:center;justify-content:space-between}
.nav button{background:none;border:0;color:var(--tx);font-size:28px;padding:4px 14px}
.nav h1{font-size:18px;margin:0;text-transform:capitalize}
.tot{text-align:center;margin:8px 0 18px}
.tot b{display:block;font-size:48px;letter-spacing:-1px}
.tot span{color:var(--mu);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:16px}
.row{display:flex;gap:10px;margin-bottom:10px}
.row{align-items:flex-start}
.row label{flex:1;min-width:0;display:block;font-size:12px;color:var(--mu)}
input{display:block;width:100%;min-width:0;height:44px;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:0 10px;margin-top:4px;-webkit-appearance:none;appearance:none}
input[type=date]{text-align:left;line-height:42px}
.add{width:100%;background:var(--ac);color:var(--ac2);border:0;border-radius:14px;padding:16px;font:600 18px inherit;font-family:inherit}
.add:active{opacity:.8}
h2{font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em;margin:0 0 8px}
.it{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--bd)}
.it:first-of-type{border-top:0}
.it input{margin:0;height:40px}
.it input[type=date]{flex:1.4}
.it input[type=text]{flex:1;text-align:right}
.it button{background:none;border:0;color:var(--mu);font-size:22px;padding:4px 8px}
.mo{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--bd);cursor:pointer;text-transform:capitalize}
.mo:first-of-type{border-top:0}.mo.on{font-weight:700}
.empty{color:var(--mu);text-align:center;padding:12px}
.edit{background:var(--ac);color:var(--ac2);border:0;border-radius:10px;padding:10px 16px;font:600 15px inherit;font-family:inherit}
.sec{flex:1;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:12px;font:600 16px inherit;font-family:inherit}
.row .add{flex:1;width:auto}
#stab{position:fixed;right:0;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;background:var(--ac);color:var(--ac2);border:0;border-radius:12px 0 0 12px;padding:16px 9px;font-weight:600;font-size:14px;font-family:inherit;z-index:3}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:10}
#ov.on{opacity:1;pointer-events:auto}
#dr{position:fixed;top:0;right:0;bottom:0;width:min(88%,420px);background:var(--bg);transform:translateX(100%);transition:transform .28s,width .28s;z-index:11;overflow-y:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:-8px 0 24px rgba(0,0,0,.25)}
#dr.on{transform:none}
#dr.full{width:100%}
.dh{display:flex;justify-content:space-between;align-items:center;font-size:20px}
.dh button,.ynav button{background:none;border:0;color:var(--tx);font-size:24px;padding:4px 10px}
.ynav{display:flex;justify-content:center;align-items:center;gap:12px;font-size:18px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.tile span{display:block;font-size:12px;color:var(--mu)}
.tile b{font-size:17px}
svg.ch{width:100%;height:auto;display:block}
</style>
</head>
<body>
<div class="nav"><button id="prev" aria-label="Mese precedente">‹</button><h1 id="mname"></h1><button id="next" aria-label="Mese successivo">›</button></div>
<div class="tot"><b id="total">0,00 €</b><span id="count"></span></div>

<div class="card" id="pastcard" style="display:none">
  <div id="pview" style="display:flex;justify-content:space-between;align-items:center;gap:12px"><span style="color:var(--mu);font-size:14px">Mese concluso: puoi modificare solo il totale</span><button class="edit" id="editb">Modifica</button></div>
  <div id="pconf" style="display:none"><div id="pconfx" style="margin-bottom:10px"></div><div class="row" style="margin:0"><button class="sec" id="noconf">Annulla</button><button class="add" id="yesconf" style="padding:12px;font-size:16px">Conferma</button></div></div>
  <div id="pedit" style="display:none"><label style="font-size:12px;color:var(--mu)">Nuovo totale (€)<input type="text" id="tp" inputmode="decimal"></label>
  <div class="row" style="margin:10px 0 0"><button class="sec" id="cancelb">Annulla</button><button class="add" id="saveb" style="padding:12px;font-size:16px">Salva</button></div></div>
</div>

<div class="card" id="addcard">
  <div class="row">
    <label>Data<input type="date" id="d"></label>
    <label>Prezzo (€)<input type="text" id="p" inputmode="decimal"></label>
  </div>
  <button class="add" id="addb">＋ Aggiungi biglietto</button>
</div>

<div class="card" id="listcard"><h2>Corse del mese</h2><div id="list"></div></div>
<div class="card"><h2>Totale per anno</h2><div id="years"></div></div>
<div class="card"><h2>Tutti i mesi</h2><div id="months"></div></div>

<button id="stab" aria-label="Apri statistiche">📊 Statistiche</button>
<div id="ov"></div>
<aside id="dr">
  <div class="dh"><b>Statistiche</b><span><button id="dexp" aria-label="Espandi">⤢</button><button id="dcl" aria-label="Chiudi">×</button></span></div>
  <div class="ynav"><button id="yp">‹</button><b id="yl"></b><button id="yn">›</button></div>
  <div class="tot"><b id="stot"></b><span id="ssub"></span></div>
  <div class="tiles" id="tiles"></div>
  <div class="card"><h2>Abbonamenti</h2><div id="sublist"></div>
  <div class="row" style="margin-top:10px"><label>Nome (facoltativo)<input id="sn" type="text" placeholder="es. Annuale"></label><label>Prezzo (€)<input id="sp" type="text" inputmode="decimal"></label></div>
  <button class="add" id="subadd">＋ Aggiungi abbonamento</button></div>
  <div class="card"><h2>Spesa mensile senza abbonamento</h2><div id="c1"></div></div>
  <div class="card"><h2>Spesa cumulata vs abbonamento</h2><div id="c2"></div></div>
  <div class="card"><h2>Backup dati</h2>
    <div class="row" style="margin:0 0 10px"><button class="sec" id="bex">Esporta</button><button class="sec" id="bim">Importa</button></div>
    <textarea id="bta" placeholder="Esporta: copia il testo che compare qui. Importa: incolla qui il testo copiato e premi Importa." style="width:100%;height:90px;font:12px monospace;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px"></textarea>
  </div>
</aside>
<div id="toast" style="display:none;position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:12px 14px;border-radius:12px;text-align:center;z-index:5"></div>
<script>
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display="none"},2500)}
window.alert=function(m){toast(m)};
var KEY="atm_spese_v1", data={entries:[],last:2.2}, cur;
try{var raw=localStorage.getItem(KEY); if(raw) data=JSON.parse(raw);}catch(e){}
data.totals=data.totals||{};data.base=data.base||{};data.entries=data.entries||[];
data.upfront=data.upfront||{};
data.subs=data.subs||[];
if(!data.subsMig){Object.keys(data.upfront).forEach(function(y){if(data.upfront[y]>0)data.subs.push({id:y+'m',year:y,name:'Abbonamento annuale',price:data.upfront[y]})});data.subsMig=1;try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}}
function pad(n){return (n<10?"0":"")+n}
function today(){var t=new Date();return t.getFullYear()+"-"+pad(t.getMonth()+1)+"-"+pad(t.getDate())}
function eur(n){return n.toLocaleString("it-IT",{style:"currency",currency:"EUR"})}
function num(s){var n=parseFloat(String(s).replace(",","."));return isNaN(n)||n<0?null:Math.round(n*100)/100}
function mtot(k){if(k<today().slice(0,7)&&data.totals[k]!==undefined)return data.totals[k];return (data.base[k]||0)+data.entries.filter(function(e){return e.date.slice(0,7)===k}).reduce(function(s,e){return s+e.price},0)}
function mlabel(k){var a=k.split("-");return new Date(+a[0],+a[1]-1,1).toLocaleDateString("it-IT",{month:"long",year:"numeric"})}
function shift(k,d){var a=k.split("-");var t=new Date(+a[0],+a[1]-1+d,1);return t.getFullYear()+"-"+pad(t.getMonth()+1)}
cur=today().slice(0,7);
var $=function(i){return document.getElementById(i)};

function setDefaultDate(){
  var t=today();
  $("d").min=t.slice(0,7)+"-01";$("d").value=t;
}
function render(){
  $("mname").textContent=mlabel(cur);
  var es=data.entries.filter(function(e){return e.date.slice(0,7)===cur}).sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0});
  var nowM=today().slice(0,7),past=cur<nowM;
  $("total").textContent=eur(mtot(cur));
  $("count").textContent=past?"Totale del mese":es.length+(es.length===1?" corsa":" corse");
  $("addcard").style.display=past?"none":"";
  $("listcard").style.display=past?"none":"";
  $("pastcard").style.display=past?"":"none";
  $("pedit").style.display="none";$("pconf").style.display="none";$("pview").style.display="flex";
  $("next").style.visibility=cur>=nowM?"hidden":"visible";
  if(!$("p").dataset.t){$("p").value=String(data.last).replace(".",",")}
  var L=$("list");L.innerHTML="";
  var b=data.base[cur];
  if(b){L.innerHTML='<div class="empty">Già conteggiati: '+eur(b)+'</div>'}
  else if(!es.length){L.innerHTML='<div class="empty">Nessuna corsa in questo mese</div>'}
  es.forEach(function(e){
    var r=document.createElement("div");r.className="it";
    var d=document.createElement("input");d.type="date";d.value=e.date;d.min=today().slice(0,7)+"-01";
    d.onchange=function(){if(d.value){e.date=d.value;save();render()}};
    var p=document.createElement("input");p.type="text";p.inputMode="decimal";p.value=String(e.price).replace(".",",");
    p.onchange=function(){var n=num(p.value);if(n===null){p.value=String(e.price).replace(".",",");return}e.price=n;save();render()};
    var x=document.createElement("button");x.textContent="×";x.setAttribute("aria-label","Elimina");
    x.onclick=function(){if(x.dataset.c!=="1"){x.dataset.c="1";x.textContent="Elimina?";x.style.color="var(--ac)";setTimeout(function(){x.dataset.c="";x.textContent="×";x.style.color=""},3000);return}data.entries=data.entries.filter(function(y){return y!==e});save();render()};
    r.append(d,p,x);L.appendChild(r);
  });
  var sums={};data.entries.forEach(function(e){sums[e.date.slice(0,7)]=1});
  Object.keys(data.totals).concat(Object.keys(data.base)).forEach(function(k){sums[k]=1});
  sums[cur]=1;
  Object.keys(sums).forEach(function(k){sums[k]=mtot(k)});
  var ys={},all=0;
  Object.keys(sums).forEach(function(k){var y=k.slice(0,4);ys[y]=(ys[y]||0)+sums[k];all+=sums[k]});
  var Y=$("years");Y.innerHTML="";
  var yk=Object.keys(ys).sort().reverse();
  yk.forEach(function(y){var r=document.createElement("div");r.className="mo";r.style.cursor="default";r.innerHTML="<span>"+y+"</span><span>"+eur(ys[y])+"</span>";Y.appendChild(r)});
  if(yk.length>1){var t=document.createElement("div");t.className="mo on";t.style.cursor="default";t.innerHTML="<span>Totale complessivo</span><span>"+eur(all)+"</span>";Y.appendChild(t)}
  var M=$("months");M.innerHTML="";
  Object.keys(sums).sort().reverse().forEach(function(k){
    var m=document.createElement("div");m.className="mo"+(k===cur?" on":"");
    m.innerHTML="<span>"+mlabel(k)+"</span><span>"+eur(sums[k])+"</span>";
    m.onclick=function(){cur=k;setDefaultDate();render();window.scrollTo(0,0)};
    M.appendChild(m);
  });
}
$("p").oninput=function(){$("p").dataset.t="1"};
$("addb").onclick=function(){
  var n=num($("p").value);
  if(n===null){alert("Inserisci un prezzo valido");return}
  if(!$("d").value){alert("Scegli una data");return}
  if($("d").value.slice(0,7)<today().slice(0,7)){alert("Per i mesi precedenti puoi modificare solo il totale");return}
  data.entries.push({id:Date.now()+Math.random(),date:$("d").value,price:n});
  data.last=n;save();
  delete $("p").dataset.t;
  cur=$("d").value.slice(0,7);
  render();
};
$("prev").onclick=function(){cur=shift(cur,-1);setDefaultDate();render()};
$("next").onclick=function(){cur=shift(cur,1);setDefaultDate();render()};
$("editb").onclick=function(){$("pview").style.display="none";$("pconfx").textContent="Vuoi modificare il totale di "+mlabel(cur)+"?";$("pconf").style.display="block"};
var sy=null;
function subsOf(y){return data.subs.filter(function(s){return s.year===y})}
function yearsList(){var s={};data.entries.forEach(function(e){s[e.date.slice(0,4)]=1});Object.keys(data.totals).concat(Object.keys(data.base)).forEach(function(k){s[k.slice(0,4)]=1});s[today().slice(0,4)]=1;return Object.keys(s).sort()}
function renderStats(){
 var yl=yearsList();if(!sy||yl.indexOf(sy)<0)sy=today().slice(0,4);
 var y=sy,nowM=today().slice(0,7),ns=subsOf(y).length,up=subsOf(y).reduce(function(a,s){return a+s.price},0),m=[],i,k;
 for(i=0;i<12;i++){k=y+'-'+pad(i+1);m.push(k>nowM?null:mtot(k))}
 var dn=m.filter(function(v){return v!==null}),tk=dn.reduce(function(s,v){return s+v},0),avg=dn.length?tk/dn.length:0;
 $('yl').textContent=y;
 $('yp').style.visibility=yl.indexOf(y)>0?'visible':'hidden';
 $('yn').style.visibility=yl.indexOf(y)<yl.length-1?'visible':'hidden';
 $('stot').textContent=eur(tk);
 $('ssub').textContent='Spesa '+y+' senza abbonamento';
 var SL=$('sublist'),ss=subsOf(y);SL.innerHTML=ss.length?'':'<div class="empty">Nessun abbonamento per '+y+'</div>';
 ss.forEach(function(s){var r=document.createElement('div');r.className='it';
  var n=document.createElement('input');n.type='text';n.value=s.name;n.style.flex='1.6';n.style.textAlign='left';n.onchange=function(){s.name=n.value.trim()||'Abbonamento';save()};
  var p=document.createElement('input');p.type='text';p.inputMode='decimal';p.value=String(s.price).replace('.',',');p.onchange=function(){var v=num(p.value);if(v===null){p.value=String(s.price).replace('.',',');return}s.price=v;save();renderStats()};
  var x=document.createElement('button');x.textContent='×';x.onclick=function(){if(x.dataset.c!=='1'){x.dataset.c='1';x.textContent='Elimina?';x.style.color='var(--ac)';setTimeout(function(){x.dataset.c='';x.textContent='×';x.style.color=''},3000);return}data.subs=data.subs.filter(function(q){return q!==s});save();renderStats()};
  r.append(n,p,x);SL.appendChild(r)});
 var hi=-1,lo=-1;
 m.forEach(function(v,j){if(v===null||v<=0)return;if(hi<0||v>m[hi])hi=j;if(lo<0||v<m[lo])lo=j});
 function mn(j){return new Date(+y,j,1).toLocaleDateString('it-IT',{month:'long'})}
 var sv=tk-up;var T=[[ns>1?'Abbonamenti ('+ns+')':'Abbonamento',eur(up)],['Risparmio',(sv>0?'+':'')+eur(sv)],['Media mensile',eur(avg)],['Mese più caro',hi<0?'–':mn(hi)+' · '+eur(m[hi])],['Mese più economico',lo<0?'–':mn(lo)+' · '+eur(m[lo])]];
 if(dn.length&&dn.length<12){T.push(['Spesa stimata a fine anno',eur(avg*12)]);T.push(['Risparmio stimato',eur(avg*12-up)])}
 $('tiles').innerHTML=T.map(function(t){return '<div class="tile"><span>'+t[0]+'</span><b style="text-transform:capitalize">'+t[1]+'</b></div>'}).join('');
 var N=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'],sl=344/12;
 var mx=Math.max.apply(null,m.map(function(v){return v||0}).concat([1]));
 var s='<svg class="ch" viewBox="0 0 360 190"><line x1="8" x2="352" y1="160" y2="160" style="stroke:var(--bd)"/>';
 m.forEach(function(v,j){var cx=8+(j+.5)*sl;
  if(v!==null&&v>0){var h=v/mx*125;s+='<rect x="'+(cx-10)+'" y="'+(160-h)+'" width="20" height="'+h+'" rx="4" style="fill:var(--ac);opacity:'+(j===hi?1:.6)+'"/><text x="'+cx+'" y="'+(154-h)+'" text-anchor="middle" style="font-size:9px;fill:var(--mu)">'+Math.round(v)+'</text>'}
  s+='<text x="'+cx+'" y="177" text-anchor="middle" style="font-size:10px;fill:var(--mu)">'+N[j]+'</text>'});
 $('c1').innerHTML=s+'</svg>';
 var c=0,pts=[[8,0]];
 m.forEach(function(v,j){if(v!==null){c+=v;pts.push([8+(j+.5)*sl,c])}});
 var mc=Math.max(c,up,1),P=pts.map(function(p){return [p[0],160-p[1]/mc*125]});
 s='<svg class="ch" viewBox="0 0 360 190"><line x1="8" x2="352" y1="160" y2="160" style="stroke:var(--bd)"/>'+(up>0?'<line x1="8" x2="352" y1="'+(160-up/mc*125)+'" y2="'+(160-up/mc*125)+'" style="stroke:var(--tx);stroke-dasharray:5 4;opacity:.6"/><text x="12" y="'+(160-up/mc*125-5)+'" style="font-size:10px;fill:var(--mu)">'+(ns>1?'Abbonamenti ':'Abbonamento ')+Math.round(up)+' €</text>':'')+'<polyline points="'+P.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ')+'" style="fill:none;stroke:var(--ac);stroke-width:2.5;stroke-linejoin:round"/>';
 P.forEach(function(p){s+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.5" style="fill:var(--ac)"/>'});
 var lp=P[P.length-1];s+='<text x="'+Math.min(lp[0],340).toFixed(1)+'" y="'+(lp[1]-9).toFixed(1)+'" text-anchor="end" style="font-size:11px;font-weight:600;fill:var(--tx)">'+Math.round(c)+' €</text>';
 N.forEach(function(n,j){s+='<text x="'+(8+(j+.5)*sl)+'" y="177" text-anchor="middle" style="font-size:10px;fill:var(--mu)">'+n+'</text>'});
 $('c2').innerHTML=s+'</svg>';
}
function closeDr(){$('dr').classList.remove('on');$('ov').classList.remove('on')}
$('stab').onclick=function(){renderStats();$('dr').classList.add('on');$('ov').classList.add('on')};
$('dcl').onclick=closeDr;$('ov').onclick=closeDr;
$('bex').onclick=function(){var t=$('bta');t.value=JSON.stringify(data);t.focus();t.select();try{t.setSelectionRange(0,t.value.length)}catch(e){}try{navigator.clipboard.writeText(t.value).then(function(){toast('Dati copiati negli appunti')},function(){toast('Tieni premuto sul testo e scegli Copia')})}catch(e){toast('Tieni premuto sul testo e scegli Copia')}};
$('bim').onclick=function(){var b=$('bim');if(b.dataset.c!=='1'){b.dataset.c='1';b.textContent='Confermi? Sovrascrive';setTimeout(function(){b.dataset.c='';b.textContent='Importa'},4000);return}b.dataset.c='';b.textContent='Importa';
 try{var d=JSON.parse($('bta').value);if(!d||!Array.isArray(d.entries))throw 0;d.totals=d.totals||{};d.base=d.base||{};d.upfront=d.upfront||{};d.subs=d.subs||[];d.seeded=1;d.seeded2=1;d.subsMig=1;data=d;save();toast('Dati importati');render();renderStats()}catch(e){toast('Testo non valido')}};
$('dexp').onclick=function(){var f=$('dr').classList.toggle('full');$('dexp').textContent=f?'⤡':'⤢'};
$('yp').onclick=function(){var l=yearsList(),i=l.indexOf(sy);if(i>0){sy=l[i-1];renderStats()}};
$('yn').onclick=function(){var l=yearsList(),i=l.indexOf(sy);if(i<l.length-1){sy=l[i+1];renderStats()}};
$('subadd').onclick=function(){var n=num($('sp').value);if(n===null||$('sp').value.trim()===''){toast('Inserisci un prezzo valido');return}data.subs.push({id:Date.now()+Math.random(),year:sy,name:$('sn').value.trim()||'Abbonamento',price:n});save();$('sn').value='';$('sp').value='';renderStats()};
$("noconf").onclick=function(){$("pconf").style.display="none";$("pview").style.display="flex"};
$("yesconf").onclick=function(){$("tp").value=String(mtot(cur)).replace(".",",");$("pconf").style.display="none";$("pedit").style.display="block";$("tp").focus()};
$("cancelb").onclick=function(){$("pedit").style.display="none";$("pview").style.display="flex"};
$("saveb").onclick=function(){var n=num($("tp").value);if(n===null){alert("Inserisci un importo valido");return}data.totals[cur]=n;save();render()};
setDefaultDate();render();
</script>
</body>
</html>
